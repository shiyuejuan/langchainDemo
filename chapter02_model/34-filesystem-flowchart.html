<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>FilesystemFileSearchMiddleware 流程图</title>
<style>
  body { background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; padding:24px; }
  h1 { font-size:18px; font-weight:600; color:#2C2C2A; text-align:center; }
  .wrap { max-width:760px; margin:0 auto; }
</style>
</head>
<body>
<div class="wrap">
<h1>FilesystemFileSearchMiddleware 运行流程图</h1>
<svg viewBox="0 0 720 716" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ① 创建时 一次性 -->
  <g>
    <rect x="80" y="70" width="560" height="72" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="360" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system, sans-serif">① 创建 Agent 时（一次性）</text>
    <text x="360" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="-apple-system, sans-serif">middleware 把 glob_search / grep_search 注入工具箱（加工具型，不拦截运行时）</text>
  </g>
  <path d="M360 142 L360 172" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="160" text-anchor="middle" font-size="12.5" fill="#5F5E5A" font-family="-apple-system, sans-serif">—— 运行时（每次用户提问）——</text>

  <!-- ② 用户提问 -->
  <g>
    <rect x="80" y="176" width="560" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="360" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="-apple-system, sans-serif">② 用户提问</text>
    <text x="360" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="-apple-system, sans-serif">项目里哪些文件用到 redis？分别在第几行？</text>
  </g>
  <path d="M360 240 L360 256" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ③ Agent 交给模型 -->
  <g>
    <rect x="80" y="260" width="560" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="360" y="288" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="-apple-system, sans-serif">③ Agent 把消息交给模型</text>
    <text x="360" y="312" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="-apple-system, sans-serif">模型此刻能看到“文件眼”这两个工具</text>
  </g>
  <path d="M360 324 L360 340" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ④ 模型决定调用 -->
  <g>
    <rect x="80" y="344" width="560" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="360" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system, sans-serif">④ 模型决定调用 grep_search（或 glob_search）</text>
    <text x="360" y="396" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system, sans-serif">自动加 (?i) 大小写不敏感、选 output_mode=content</text>
  </g>
  <path d="M360 408 L360 424" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑤ grep 执行 子流程 -->
  <g>
    <rect x="80" y="428" width="560" height="96" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="360" y="456" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806" font-family="-apple-system, sans-serif">⑤ grep_search 执行</text>
    <text x="360" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#BA7517" font-family="-apple-system, sans-serif">校验虚拟路径（禁 .. / ~，越界即拒）</text>
    <text x="360" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#BA7517" font-family="-apple-system, sans-serif">优先 rg --json（30s 超时）→ 否则 Python 正则（跳过 &gt;10MB）</text>
  </g>
  <path d="M360 524 L360 540" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑥ 返回命中 -->
  <g>
    <rect x="80" y="544" width="560" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="360" y="572" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="-apple-system, sans-serif">⑥ 返回命中：file:line:content</text>
    <text x="360" y="596" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="-apple-system, sans-serif">如 /src/main.py:2:import redis</text>
  </g>
  <path d="M360 608 L360 624" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ⑦ 模型回答 -->
  <g>
    <rect x="80" y="628" width="560" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="360" y="656" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system, sans-serif">⑦ 模型基于结果组织回答 → 回答用户</text>
    <text x="360" y="678" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system, sans-serif">（还会顺手指出 main.py 硬编码 localhost 与文档 prod 不一致）</text>
  </g>

  <text x="360" y="714" text-anchor="middle" font-size="11.5" fill="#888780" font-family="-apple-system, sans-serif">异常分支：路径越界 / 非法正则 → 直接返回 No files found / Invalid regex，不报错中断</text>
</svg>
</div>
</body>
</html>
